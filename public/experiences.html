<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiences | YoloCalc</title>
  <meta name="description" content="Choose the experiences that matter most to you. Mark your one-way doors.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<nav>
  <a href="/" class="nav-logo"><span class="nav-logo-dot"></span> YoloCalc</a>
  <div class="nav-progress">
    <a href="/calculator.html" class="nav-step completed">
      <span class="nav-step-num">✓</span>
      <span>Finances</span>
    </a>
    <div class="nav-connector"></div>
    <a href="/experiences.html" class="nav-step active">
      <span class="nav-step-num">2</span>
      <span>Experiences</span>
    </a>
    <div class="nav-connector"></div>
    <a href="/lifemap.html" class="nav-step">
      <span class="nav-step-num">3</span>
      <span>Life Map</span>
    </a>
  </div>
</nav>

<main class="app-container" style="padding-bottom: 100px;">
  <header class="screen-header">
    <div class="screen-label">Step 2 of 3</div>
    <h1 class="screen-title">What experiences matter most?</h1>
    <p class="screen-subtitle">Select the adventures, trips, and milestones you want in your life. We'll help you time them perfectly.</p>
  </header>

  <div class="experience-categories" id="experience-categories">
    <!-- Categories will be rendered here -->
  </div>

  <section class="add-custom-section">
    <button type="button" class="add-custom-btn" id="toggle-custom-btn">
      <span>+</span> Add Custom Experience
    </button>
    <div class="custom-form" id="custom-form">
      <div class="custom-form-grid">
        <div class="form-group">
          <label class="form-label" for="custom-name">Experience Name</label>
          <input type="text" id="custom-name" class="form-input" placeholder="e.g., Bali Yoga Retreat">
        </div>
        <div class="form-group">
          <label class="form-label" for="custom-cost">Cost</label>
          <div class="input-prefix">
            <input type="number" id="custom-cost" class="form-input" placeholder="5000" min="0">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="custom-type">Type</label>
          <select id="custom-type" class="form-input">
            <option value="twoway">Two-Way Door (Flexible)</option>
            <option value="oneway">One-Way Door (Time-Sensitive)</option>
          </select>
        </div>
      </div>
      <button type="button" class="btn-primary" id="add-custom-btn" style="margin-top: 0.5rem;">
        Add Experience
      </button>
    </div>
  </section>

  <div class="btn-row" style="margin-top: 2rem;">
    <a href="/calculator.html" class="btn-secondary">← Back to Finances</a>
    <button type="button" class="btn-primary" id="continue-btn">
      See Your Life Map
      <span>→</span>
    </button>
  </div>
</main>

<div class="selected-summary" id="selected-summary">
  <div class="summary-stats">
    <div class="summary-stat">
      <span class="summary-stat-label">Selected</span>
      <span class="summary-stat-value" id="summary-count">0</span>
    </div>
    <div class="summary-stat">
      <span class="summary-stat-label">One-Way Doors</span>
      <span class="summary-stat-value sunset" id="summary-oneway">0</span>
    </div>
    <div class="summary-stat">
      <span class="summary-stat-label">Total Cost</span>
      <span class="summary-stat-value" id="summary-cost">$0</span>
    </div>
  </div>
  <button type="button" class="btn-primary" onclick="window.location.href='/lifemap.html'">
    Continue →
  </button>
</div>

<script src="/js/data.js"></script>
<script>
  const { EXPERIENCE_TEMPLATES, CATEGORIES, STORAGE_KEYS, saveData, loadData, formatCurrency } = window.YoloCalc;

  // DOM Elements
  const categoriesContainer = document.getElementById('experience-categories');
  const selectedSummary = document.getElementById('selected-summary');
  const summaryCount = document.getElementById('summary-count');
  const summaryOneway = document.getElementById('summary-oneway');
  const summaryCost = document.getElementById('summary-cost');
  const toggleCustomBtn = document.getElementById('toggle-custom-btn');
  const customForm = document.getElementById('custom-form');
  const addCustomBtn = document.getElementById('add-custom-btn');
  const continueBtn = document.getElementById('continue-btn');

  // State
  let selectedExperiences = [];
  let allExperiences = [...EXPERIENCE_TEMPLATES];
  let children = [];

  // Initialize
  function init() {
    // Load saved data
    const savedExperiences = loadData(STORAGE_KEYS.experiences, []);
    children = loadData(STORAGE_KEYS.children, []);

    // Merge custom experiences
    savedExperiences.forEach(exp => {
      if (exp.isCustom && !allExperiences.find(e => e.id === exp.id)) {
        allExperiences.push(exp);
      }
    });

    // Mark selected ones
    selectedExperiences = savedExperiences.map(exp => exp.id);

    renderCategories();
    updateSummary();
  }

  // Render categories and experiences
  function renderCategories() {
    categoriesContainer.innerHTML = '';

    Object.entries(CATEGORIES).forEach(([categoryId, category]) => {
      const categoryExperiences = allExperiences.filter(exp => exp.category === categoryId);

      // Skip empty categories
      if (categoryExperiences.length === 0) return;

      // Filter family experiences if no children
      const filteredExperiences = categoryExperiences.filter(exp => {
        if (exp.requiresKids && children.length === 0) {
          return false;
        }
        return true;
      });

      if (filteredExperiences.length === 0) return;

      const selectedCount = filteredExperiences.filter(exp => selectedExperiences.includes(exp.id)).length;

      const section = document.createElement('section');
      section.className = 'category-section';
      section.innerHTML = `
        <div class="category-header">
          <span class="category-icon">${category.icon}</span>
          <span class="category-name">${category.name}</span>
          <span class="category-count">${selectedCount} of ${filteredExperiences.length}</span>
        </div>
        <div class="experience-list" data-category="${categoryId}">
          ${filteredExperiences.map(exp => renderExperienceCard(exp)).join('')}
        </div>
      `;

      categoriesContainer.appendChild(section);
    });

    // Add click handlers
    document.querySelectorAll('.experience-card').forEach(card => {
      card.addEventListener('click', (e) => {
        // Don't toggle if clicking on cost input
        if (e.target.classList.contains('experience-cost-input')) return;

        const expId = card.dataset.id;
        toggleExperience(expId);
      });
    });

    // Add cost input handlers
    document.querySelectorAll('.experience-cost-input').forEach(input => {
      input.addEventListener('change', (e) => {
        const expId = e.target.dataset.id;
        const newCost = parseFloat(e.target.value) || 0;
        updateExperienceCost(expId, newCost);
      });

      input.addEventListener('click', (e) => {
        e.stopPropagation();
      });
    });
  }

  // Render a single experience card
  function renderExperienceCard(exp) {
    const isSelected = selectedExperiences.includes(exp.id);
    const doorLabel = exp.doorType === 'oneway' ? 'One-Way' : 'Two-Way';
    const doorClass = exp.doorType === 'oneway' ? 'door-oneway' : 'door-twoway';

    let metaText = '';
    if (exp.requiresKids) {
      metaText = `Ages ${exp.kidAgeMin}-${exp.kidAgeMax}`;
    } else if (exp.optimalAgeMin && exp.optimalAgeMax && exp.optimalAgeMax < 100) {
      metaText = `Best ${exp.optimalAgeMin}-${exp.optimalAgeMax}`;
    }

    return `
      <div class="experience-card ${isSelected ? 'selected' : ''}" data-id="${exp.id}">
        <div class="experience-checkbox">
          ${isSelected ? '✓' : ''}
        </div>
        <div class="experience-info">
          <div class="experience-name">${exp.icon} ${exp.name}</div>
          <div class="experience-meta">
            <span class="experience-door ${doorClass}">${doorLabel}</span>
            ${metaText ? `<span>${metaText}</span>` : ''}
          </div>
        </div>
        <input type="number" class="experience-cost-input" value="${exp.cost}" data-id="${exp.id}" min="0" step="500">
      </div>
    `;
  }

  // Toggle experience selection
  function toggleExperience(expId) {
    const index = selectedExperiences.indexOf(expId);
    if (index === -1) {
      selectedExperiences.push(expId);
    } else {
      selectedExperiences.splice(index, 1);
    }
    renderCategories();
    updateSummary();
    saveSelections();
  }

  // Update experience cost
  function updateExperienceCost(expId, newCost) {
    const exp = allExperiences.find(e => e.id === expId);
    if (exp) {
      exp.cost = newCost;
    }
    updateSummary();
    saveSelections();
  }

  // Update summary bar
  function updateSummary() {
    const selected = allExperiences.filter(exp => selectedExperiences.includes(exp.id));
    const totalCost = selected.reduce((sum, exp) => sum + exp.cost, 0);
    const onewayCount = selected.filter(exp => exp.doorType === 'oneway').length;

    summaryCount.textContent = selected.length;
    summaryOneway.textContent = onewayCount;
    summaryCost.textContent = formatCurrency(totalCost);

    // Show/hide summary bar
    if (selected.length > 0) {
      selectedSummary.classList.add('visible');
    } else {
      selectedSummary.classList.remove('visible');
    }
  }

  // Save selections to localStorage
  function saveSelections() {
    const experiencesToSave = allExperiences
      .filter(exp => selectedExperiences.includes(exp.id))
      .map(exp => ({
        ...exp,
        selected: true,
      }));

    saveData(STORAGE_KEYS.experiences, experiencesToSave);
  }

  // Custom experience handling
  toggleCustomBtn.addEventListener('click', () => {
    customForm.classList.toggle('visible');
    toggleCustomBtn.style.display = customForm.classList.contains('visible') ? 'none' : 'flex';
  });

  addCustomBtn.addEventListener('click', () => {
    const name = document.getElementById('custom-name').value.trim();
    const cost = parseFloat(document.getElementById('custom-cost').value) || 0;
    const type = document.getElementById('custom-type').value;

    if (!name) {
      alert('Please enter an experience name');
      return;
    }

    const newExp = {
      id: 'custom-' + Date.now(),
      name,
      category: 'milestone',
      icon: '✨',
      cost,
      doorType: type,
      optimalAgeMin: 0,
      optimalAgeMax: 100,
      isCustom: true,
    };

    allExperiences.push(newExp);
    selectedExperiences.push(newExp.id);

    // Reset form
    document.getElementById('custom-name').value = '';
    document.getElementById('custom-cost').value = '';
    customForm.classList.remove('visible');
    toggleCustomBtn.style.display = 'flex';

    renderCategories();
    updateSummary();
    saveSelections();
  });

  // Continue button
  continueBtn.addEventListener('click', () => {
    saveSelections();
    window.location.href = '/lifemap.html';
  });

  // Initialize
  init();
</script>

</body>
</html>
