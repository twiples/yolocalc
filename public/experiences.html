<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experiences | YoloCalc</title>
  <meta name="description" content="Choose the experiences that matter most to you.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .travelers-section {
      background: var(--white);
      border: 1px solid var(--warm-border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .travelers-row {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .traveler-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .traveler-label {
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .traveler-input {
      width: 60px;
      padding: 0.5rem;
      border: 1px solid var(--warm-border);
      border-radius: 8px;
      font-size: 1rem;
      text-align: center;
    }
    .experience-type-badge {
      font-size: 0.65rem;
      padding: 0.2rem 0.5rem;
      border-radius: 100px;
      background: var(--cream-deep);
      color: var(--text-muted);
    }
    .experience-type-badge.recurring {
      background: var(--teal-light);
      color: var(--teal);
    }
    .tier-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }
    .tier-luxury { background: #fef3c7; color: #b45309; }
    .tier-premium { background: #dbeafe; color: #1d4ed8; }
    .tier-local { background: #dcfce7; color: #15803d; }
    .category-description {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      font-style: italic;
    }
    .timing-selector {
      display: flex;
      gap: 0.4rem;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--warm-border);
    }
    .timing-btn {
      flex: 1;
      padding: 0.4rem 0.5rem;
      border: 1px solid var(--warm-border);
      border-radius: 6px;
      background: var(--white);
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .timing-btn:hover {
      border-color: var(--sunset);
      color: var(--sunset);
    }
    .timing-btn.active {
      background: var(--sunset);
      border-color: var(--sunset);
      color: white;
    }
    .timing-label {
      font-size: 0.68rem;
      color: var(--text-faint);
      margin-bottom: 0.4rem;
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo"><span class="nav-logo-dot"></span> YoloCalc</a>
  <div class="nav-progress">
    <a href="/calculator.html" class="nav-step completed">
      <span class="nav-step-num">✓</span>
      <span>Finances</span>
    </a>
    <div class="nav-connector"></div>
    <a href="/experiences.html" class="nav-step active">
      <span class="nav-step-num">2</span>
      <span>Experiences</span>
    </a>
    <div class="nav-connector"></div>
    <a href="/lifemap.html" class="nav-step">
      <span class="nav-step-num">3</span>
      <span>Life Map</span>
    </a>
  </div>
</nav>

<main class="app-container" style="padding-bottom: 120px;">
  <header class="screen-header">
    <div class="screen-label">Step 2 of 3</div>
    <h1 class="screen-title">What will fill your life?</h1>
    <p class="screen-subtitle">Adventures, learning, giving back, meaningful projects — choose what matters most.</p>
  </header>

  <section class="travelers-section">
    <div class="form-section-title" style="margin-bottom: 1rem;">
      <span class="form-section-icon">👥</span>
      Who's Coming Along?
    </div>
    <div class="travelers-row">
      <div class="traveler-group">
        <label class="traveler-label">Adults:</label>
        <input type="number" id="adults-count" class="traveler-input" value="2" min="1" max="10">
      </div>
      <div class="traveler-group">
        <label class="traveler-label">Children:</label>
        <input type="number" id="children-count" class="traveler-input" value="0" min="0" max="10">
      </div>
    </div>
    <input type="hidden" id="inflation-rate" value="3">
  </section>

  <div class="experience-categories" id="experience-categories"></div>

  <div class="btn-row" style="margin-top: 2rem;">
    <a href="/calculator.html" class="btn-secondary">← Back</a>
    <button type="button" class="btn-primary" id="continue-btn">
      See Your Life Map <span>→</span>
    </button>
  </div>
</main>

<div class="selected-summary" id="selected-summary">
  <div class="summary-stats">
    <div class="summary-stat">
      <span class="summary-stat-label">Adventures Selected</span>
      <span class="summary-stat-value" id="summary-count">0</span>
    </div>
    <div class="summary-stat">
      <span class="summary-stat-label">Life Phases Covered</span>
      <span class="summary-stat-value" id="summary-phases">0</span>
    </div>
  </div>
  <button type="button" class="btn-primary" id="summary-continue-btn">See Your Life Map →</button>
</div>

<script>
(function() {
  var STORAGE_KEYS = {
    financials: 'yolocalc_financials',
    children: 'yolocalc_children',
    experiences: 'yolocalc_experiences',
    travelers: 'yolocalc_travelers'
  };

  // Experience templates organized by category
  // Costs are PER PERSON in today's dollars
  var EXPERIENCE_TEMPLATES = [
    // ADVENTURES - Travel and bucket list experiences
    { id: 'adv-luxury', name: 'Annual Luxury Adventure', category: 'adventures', icon: '✈️', costPerPerson: 20000, tier: 'luxury', recurring: true, recurringYears: 30, description: 'Safari, Maldives, Antarctica — the big bucket list trips' },
    { id: 'adv-premium', name: 'Annual Premium Adventure', category: 'adventures', icon: '🌍', costPerPerson: 10000, tier: 'premium', recurring: true, recurringYears: 30, description: 'Europe, Asia, South America — meaningful exploration' },
    { id: 'adv-local', name: 'Annual Local Adventure', category: 'adventures', icon: '🚗', costPerPerson: 3000, tier: 'local', recurring: true, recurringYears: 30, description: 'Road trips, national parks, weekend getaways' },
    { id: 'adv-family', name: 'Annual Family Adventure', category: 'adventures', icon: '👨‍👩‍👧', costPerPerson: 8000, tier: 'premium', recurring: true, recurringYears: 18, requiresKids: true, description: 'Disney, beach vacations, creating family memories' },
    { id: 'adv-bucket', name: 'Once-in-a-Lifetime Experience', category: 'adventures', icon: '🎯', costPerPerson: 25000, tier: 'luxury', recurring: false, description: 'That one big dream — Everest base camp, around the world, etc.' },

    // LEARNING & GROWTH - Skills, education, personal development
    { id: 'learn-course', name: 'Annual Learning Investment', category: 'learning', icon: '📚', costPerPerson: 3000, tier: 'local', recurring: true, recurringYears: 30, description: 'Courses, certifications, workshops — never stop growing' },
    { id: 'learn-hobby', name: 'New Hobby or Skill', category: 'learning', icon: '🎸', costPerPerson: 2000, tier: 'local', recurring: true, recurringYears: 30, description: 'Music, art, cooking, language — explore your interests' },
    { id: 'learn-degree', name: 'Advanced Degree or Program', category: 'learning', icon: '🎓', costPerPerson: 50000, tier: 'luxury', recurring: false, description: 'MBA, masters, intensive program — level up your career' },
    { id: 'learn-retreat', name: 'Annual Retreat or Conference', category: 'learning', icon: '🧘', costPerPerson: 4000, tier: 'premium', recurring: true, recurringYears: 20, description: 'Wellness retreat, industry conference, mastermind' },
    { id: 'learn-coach', name: 'Coaching or Mentorship', category: 'learning', icon: '💡', costPerPerson: 5000, tier: 'premium', recurring: true, recurringYears: 10, description: 'Executive coach, life coach, personal development' },

    // GIVING BACK - Volunteering, donations, making a difference
    { id: 'give-donate', name: 'Annual Charitable Giving', category: 'giving', icon: '💝', costPerPerson: 5000, tier: 'premium', recurring: true, recurringYears: 40, description: 'Support causes you believe in — make a lasting impact' },
    { id: 'give-major', name: 'Major Philanthropic Gift', category: 'giving', icon: '🏛️', costPerPerson: 50000, tier: 'luxury', recurring: false, description: 'Endowment, building fund, scholarship — leave a legacy' },
    { id: 'give-volunteer', name: 'Volunteer Travel', category: 'giving', icon: '🤝', costPerPerson: 4000, tier: 'premium', recurring: true, recurringYears: 20, description: 'Service trips, habitat builds, teaching abroad' },
    { id: 'give-local', name: 'Local Volunteering', category: 'giving', icon: '🏠', costPerPerson: 500, tier: 'local', recurring: true, recurringYears: 40, description: 'Food bank, mentoring, community service — give your time' },
    { id: 'give-kids', name: 'Gifts to Children', category: 'giving', icon: '🎁', costPerPerson: 10000, tier: 'premium', recurring: true, recurringYears: 20, requiresKids: true, description: 'Help with house, wedding, education — give while you\'re here' },

    // MEANINGFUL PROJECTS - Creative work, legacy, starting something
    { id: 'project-creative', name: 'Creative Project', category: 'projects', icon: '🎨', costPerPerson: 5000, tier: 'premium', recurring: false, description: 'Write a book, record an album, create art — express yourself' },
    { id: 'project-business', name: 'Start Something', category: 'projects', icon: '🚀', costPerPerson: 25000, tier: 'luxury', recurring: false, description: 'Side business, nonprofit, passion project — build something' },
    { id: 'project-home', name: 'Dream Home Project', category: 'projects', icon: '🏡', costPerPerson: 30000, tier: 'luxury', recurring: false, description: 'Renovation, garden, workshop — create your perfect space' },
    { id: 'project-family', name: 'Family History Project', category: 'projects', icon: '📜', costPerPerson: 3000, tier: 'local', recurring: false, description: 'Genealogy, memoir, photo archive — preserve your story' },
    { id: 'project-annual', name: 'Annual Passion Project', category: 'projects', icon: '⭐', costPerPerson: 2000, tier: 'local', recurring: true, recurringYears: 30, description: 'Time and resources for what matters most to you' }
  ];

  var CATEGORIES = {
    adventures: { name: 'Adventures', icon: '✈️', description: 'Travel, exploration, and bucket list experiences' },
    learning: { name: 'Learning & Growth', icon: '📚', description: 'Skills, education, and personal development' },
    giving: { name: 'Giving Back', icon: '💝', description: 'Volunteering, donations, and making a difference' },
    projects: { name: 'Meaningful Projects', icon: '🚀', description: 'Creative work, legacy projects, and building something' }
  };

  function saveData(key, data) {
    try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
  }

  function loadData(key, defaultValue) {
    try {
      var stored = localStorage.getItem(key);
      return stored ? JSON.parse(stored) : (defaultValue || null);
    } catch (e) { return defaultValue || null; }
  }

  function formatCurrency(amount) {
    if (amount >= 1000000) return '$' + (amount / 1000000).toFixed(1) + 'M';
    if (amount >= 1000) return '$' + Math.round(amount / 1000) + 'K';
    return '$' + Math.round(amount);
  }

  // DOM elements
  var categoriesContainer = document.getElementById('experience-categories');
  var selectedSummary = document.getElementById('selected-summary');
  var summaryCount = document.getElementById('summary-count');
  var summaryPhases = document.getElementById('summary-phases');
  var continueBtn = document.getElementById('continue-btn');
  var summaryContinueBtn = document.getElementById('summary-continue-btn');
  var adultsInput = document.getElementById('adults-count');
  var childrenInput = document.getElementById('children-count');
  var inflationInput = document.getElementById('inflation-rate');

  // Life phases for timing
  var LIFE_PHASES = [
    { id: 'early', label: 'Young & Free', ageRange: [20, 35] },
    { id: 'family', label: 'Family Years', ageRange: [30, 55] },
    { id: 'empty', label: 'Empty Nest', ageRange: [50, 70] },
    { id: 'golden', label: 'Golden Years', ageRange: [65, 95] }
  ];

  // State
  var selectedIds = [];
  var selectedTimings = {}; // Track timing phases for one-time experiences (now stores arrays)
  var children = [];
  var travelers = { adults: 2, children: 0, inflation: 3 };

  function loadSavedData() {
    children = loadData(STORAGE_KEYS.children, []);
    var savedExperiences = loadData(STORAGE_KEYS.experiences, []);
    var savedTravelers = loadData(STORAGE_KEYS.travelers, null);

    if (savedTravelers) {
      travelers = savedTravelers;
      adultsInput.value = travelers.adults;
      childrenInput.value = travelers.children;
      inflationInput.value = travelers.inflation;
    } else {
      // Default: set children count from saved children
      travelers.children = children.length;
      childrenInput.value = travelers.children;
    }

    savedExperiences.forEach(function(exp) {
      if (selectedIds.indexOf(exp.id) === -1) {
        selectedIds.push(exp.id);
      }
      // Restore timing if saved (now an array of phase IDs)
      if (exp.timing && Array.isArray(exp.timing)) {
        selectedTimings[exp.id] = exp.timing;
      } else if (exp.timing) {
        // Handle legacy single-value timing
        selectedTimings[exp.id] = [exp.timing];
      }
    });
  }

  function getTotalTravelers(exp) {
    if (exp.adultsOnly) return travelers.adults;
    return travelers.adults + travelers.children;
  }

  function renderCategories() {
    categoriesContainer.innerHTML = '';

    Object.keys(CATEGORIES).forEach(function(categoryId) {
      var category = CATEGORIES[categoryId];
      var categoryExps = EXPERIENCE_TEMPLATES.filter(function(exp) {
        if (exp.category !== categoryId) return false;
        // Hide family-specific experiences if no kids
        if (exp.requiresKids && children.length === 0 && travelers.children === 0) return false;
        return true;
      });

      if (categoryExps.length === 0) return;

      var selectedCount = categoryExps.filter(function(exp) {
        return selectedIds.indexOf(exp.id) !== -1;
      }).length;

      var section = document.createElement('section');
      section.className = 'category-section';

      var html = '<div class="category-header">' +
        '<span class="category-icon">' + category.icon + '</span>' +
        '<span class="category-name">' + category.name + '</span>' +
        (selectedCount > 0 ? '<span class="category-count">✓ ' + selectedCount + '</span>' : '') +
        '</div>' +
        '<div class="category-description">' + (category.description || '') + '</div>' +
        '<div class="experience-list">';

      categoryExps.forEach(function(exp) {
        var isSelected = selectedIds.indexOf(exp.id) !== -1;
        var tierClass = 'tier-' + exp.tier;
        var tierLabel = exp.tier.charAt(0).toUpperCase() + exp.tier.slice(1);
        var currentTiming = selectedTimings[exp.id] || 'now';

        html += '<div class="experience-card ' + (isSelected ? 'selected' : '') + '" data-id="' + exp.id + '">' +
          '<div class="experience-checkbox">' + (isSelected ? '✓' : '') + '</div>' +
          '<div class="experience-info">' +
          '<div class="experience-name">' + exp.icon + ' ' + exp.name + '</div>' +
          '<div style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem; line-height: 1.4;">' + exp.description + '</div>' +
          '<div class="experience-meta" style="margin-top: 0.5rem;">' +
          '<span class="tier-badge ' + tierClass + '">' + tierLabel + '</span>' +
          (exp.recurring ? '<span class="experience-type-badge recurring">Annual</span>' : '<span class="experience-type-badge">One-time</span>') +
          '</div>';

        // Add timing selector for selected one-time experiences
        if (isSelected && !exp.recurring) {
          var selectedPhases = currentTiming || [];
          html += '<div class="timing-selector" data-exp-id="' + exp.id + '">' +
            '<div style="width: 100%;">' +
            '<div class="timing-label">When in your life? <span style="opacity: 0.7;">(select all that apply)</span></div>' +
            '<div style="display: flex; gap: 0.4rem;">';

          LIFE_PHASES.forEach(function(phase) {
            var isActive = selectedPhases.indexOf(phase.id) !== -1;
            html += '<button class="timing-btn ' + (isActive ? 'active' : '') + '" data-timing="' + phase.id + '">' + phase.label + '</button>';
          });

          html += '</div></div></div>';
        }

        html += '</div></div>';
      });

      html += '</div>';
      section.innerHTML = html;
      categoriesContainer.appendChild(section);
    });

    // Add click handlers for experience cards
    var cards = document.querySelectorAll('.experience-card');
    for (var i = 0; i < cards.length; i++) {
      (function(card) {
        card.addEventListener('click', function(e) {
          // Don't toggle if clicking on timing button
          if (e.target.classList.contains('timing-btn')) return;
          var expId = card.getAttribute('data-id');
          toggleExperience(expId);
        });
      })(cards[i]);
    }

    // Add click handlers for timing buttons
    var timingBtns = document.querySelectorAll('.timing-btn');
    for (var j = 0; j < timingBtns.length; j++) {
      (function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var selector = btn.closest('.timing-selector');
          var expId = selector.getAttribute('data-exp-id');
          var timing = btn.getAttribute('data-timing');
          setTiming(expId, timing);
        });
      })(timingBtns[j]);
    }
  }

  function setTiming(expId, phaseId) {
    if (!selectedTimings[expId]) {
      selectedTimings[expId] = [];
    }
    var idx = selectedTimings[expId].indexOf(phaseId);
    if (idx === -1) {
      selectedTimings[expId].push(phaseId);
    } else {
      selectedTimings[expId].splice(idx, 1);
    }
    renderCategories();
    updateSummary();
  }

  function toggleExperience(expId) {
    var idx = selectedIds.indexOf(expId);
    if (idx === -1) {
      selectedIds.push(expId);
    } else {
      selectedIds.splice(idx, 1);
    }
    renderCategories();
    updateSummary();
  }

  function updateSummary() {
    var phasesWithSelections = {};

    selectedIds.forEach(function(id) {
      var exp = EXPERIENCE_TEMPLATES.find(function(e) { return e.id === id; });
      if (exp) {
        phasesWithSelections[exp.category] = true;
      }
    });

    summaryCount.textContent = selectedIds.length;
    summaryPhases.textContent = Object.keys(phasesWithSelections).length;

    if (selectedIds.length > 0) {
      selectedSummary.classList.add('visible');
    } else {
      selectedSummary.classList.remove('visible');
    }
  }

  function saveAndContinue() {
    // Save travelers
    travelers.adults = parseInt(adultsInput.value) || 2;
    travelers.children = parseInt(childrenInput.value) || 0;
    travelers.inflation = parseFloat(inflationInput.value) || 3;
    saveData(STORAGE_KEYS.travelers, travelers);

    // Save experiences
    var experiencesToSave = selectedIds.map(function(id) {
      var exp = EXPERIENCE_TEMPLATES.find(function(e) { return e.id === id; });
      if (!exp) return null;

      var people = getTotalTravelers(exp);

      return {
        id: exp.id,
        name: exp.name,
        category: exp.category,
        icon: exp.icon,
        costPerPerson: exp.costPerPerson,
        totalPeople: people,
        baseCost: exp.costPerPerson * people,
        tier: exp.tier,
        doorType: exp.doorType,
        optimalAgeMin: exp.optimalAgeMin,
        optimalAgeMax: exp.optimalAgeMax,
        kidAgeMin: exp.kidAgeMin,
        kidAgeMax: exp.kidAgeMax,
        requiresKids: exp.requiresKids,
        atRetirement: exp.atRetirement,
        recurring: exp.recurring,
        recurringYears: exp.recurringYears,
        recurringInterval: exp.recurringInterval || 1,
        adultsOnly: exp.adultsOnly,
        timing: exp.recurring ? null : (selectedTimings[exp.id] && selectedTimings[exp.id].length > 0 ? selectedTimings[exp.id] : ['early', 'family', 'empty', 'golden'])
      };
    }).filter(function(e) { return e !== null; });

    saveData(STORAGE_KEYS.experiences, experiencesToSave);
    window.location.href = '/lifemap.html';
  }

  // Traveler input handlers
  adultsInput.addEventListener('change', function() {
    travelers.adults = parseInt(adultsInput.value) || 2;
    renderCategories();
    updateSummary();
  });

  childrenInput.addEventListener('change', function() {
    travelers.children = parseInt(childrenInput.value) || 0;
    renderCategories();
    updateSummary();
  });

  continueBtn.addEventListener('click', saveAndContinue);
  summaryContinueBtn.addEventListener('click', saveAndContinue);

  // Initialize
  loadSavedData();
  renderCategories();
  updateSummary();
})();
</script>

</body>
</html>
